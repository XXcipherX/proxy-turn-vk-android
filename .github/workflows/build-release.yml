name: Build WDTT Release

on:
  workflow_dispatch:
    inputs:
      release_name:
        description: Release title. Empty = WDTT <version> (<tag>)
        required: false
        type: string
      changelog:
        description: Optional Markdown changelog
        required: false
        type: string
      draft:
        description: Create as draft release
        required: true
        default: false
        type: boolean
      prerelease:
        description: Mark release as prerelease
        required: true
        default: false
        type: boolean

jobs:
  build-release:
    name: Build release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    env:
      ANDROID_MIN_API: "28"
      ANDROID_COMPILE_SDK: "35"
      ANDROID_BUILD_TOOLS: "35.0.0"
      ANDROID_NDK_VERSION: "27.2.12479018"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platforms;android-${ANDROID_COMPILE_SDK}" "build-tools;${ANDROID_BUILD_TOOLS}" "ndk;${ANDROID_NDK_VERSION}"
          echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"
          cache: true
          cache-dependency-path: |
            app/src/main/assets/android-client/go.sum
            app/src/main/assets/linux-server/go.sum

      - name: Build native components
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/build_server.sh scripts/build-go-lib.sh scripts/build_client.sh gradlew
          (cd app/src/main/assets/linux-server && go mod download)
          scripts/build_server.sh
          scripts/build_client.sh

      - name: Resolve Android release version
        id: android_version
        shell: bash
        run: |
          set -euo pipefail
          source_version_code="$(sed -nE 's/^[[:space:]]*val defaultVersionCode = ([0-9]+).*/\1/p' app/build.gradle.kts | head -n 1)"
          source_version_name="$(sed -nE 's/^[[:space:]]*val defaultVersionName = "([0-9]+(\.[0-9]+)*)".*/\1/p' app/build.gradle.kts | head -n 1)"
          if ! [[ "$source_version_code" =~ ^[0-9]+$ ]]; then
            echo "Unable to read the source versionCode from app/build.gradle.kts"
            exit 1
          fi
          if ! [[ "$source_version_name" =~ ^[0-9]+([.][0-9]+)*$ ]]; then
            echo "Unable to read the source versionName from app/build.gradle.kts"
            exit 1
          fi
          if (( GITHUB_RUN_NUMBER >= 100000 )); then
            echo "GITHUB_RUN_NUMBER is too large for the automatic versionCode scheme"
            exit 1
          fi
          version_code=$((source_version_code * 100000 + GITHUB_RUN_NUMBER))
          version_name="${source_version_name}.${GITHUB_RUN_NUMBER}"
          if (( version_code > 2100000000 )); then
            echo "Calculated versionCode exceeds Android's limit: $version_code"
            exit 1
          fi
          echo "version_code=$version_code" >> "$GITHUB_OUTPUT"
          echo "version_name=$version_name" >> "$GITHUB_OUTPUT"
          printf '### Android release\n\n- versionName: %s\n- versionCode: %s\n' \
            "$version_name" "$version_code" >> "$GITHUB_STEP_SUMMARY"

      - name: Restore permanent release keystore
        id: release_keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for variable in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!variable:-}" ]; then
              echo "Required GitHub Actions secret is missing: ANDROID_${variable}"
              exit 1
            fi
          done
          keystore_path="${RUNNER_TEMP}/wdtt-release.keystore"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          chmod 600 "$keystore_path"
          keytool -list -keystore "$keystore_path" -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" >/dev/null
          echo "keystore_path=$keystore_path" >> "$GITHUB_OUTPUT"

      - name: Build Android release APKs
        shell: bash
        env:
          KEYSTORE_FILE: ${{ steps.release_keystore.outputs.keystore_path }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew clean :app:assembleRelease \
            -PrequireReleaseSigning=true \
            -PreleaseVersionCode=${{ steps.android_version.outputs.version_code }} \
            -PreleaseVersionName=${{ steps.android_version.outputs.version_name }} \
            --no-daemon --stacktrace

      - name: Verify APK signatures and versions
        shell: bash
        env:
          KEYSTORE_PATH: ${{ steps.release_keystore.outputs.keystore_path }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          EXPECTED_VERSION_CODE: ${{ steps.android_version.outputs.version_code }}
          EXPECTED_VERSION_NAME: ${{ steps.android_version.outputs.version_name }}
        run: |
          set -euo pipefail
          apksigner="${ANDROID_SDK_ROOT}/build-tools/${ANDROID_BUILD_TOOLS}/apksigner"
          aapt="${ANDROID_SDK_ROOT}/build-tools/${ANDROID_BUILD_TOOLS}/aapt"
          expected_cert_sha256="$(
            keytool -exportcert -keystore "$KEYSTORE_PATH" -storepass "$KEYSTORE_PASSWORD" \
              -alias "$KEY_ALIAS" | sha256sum | awk '{print $1}'
          )"
          mapfile -t apks < <(find app/build/outputs/apk/release -type f -name '*.apk' | sort)
          if [ "${#apks[@]}" -eq 0 ]; then
            echo "No release APKs were generated"
            exit 1
          fi
          for apk in "${apks[@]}"; do
            "$apksigner" verify --verbose "$apk"
            actual_cert_sha256="$(
              "$apksigner" verify --print-certs "$apk" |
                sed -n 's/^Signer #1 certificate SHA-256 digest: //p' |
                head -n 1 | tr '[:upper:]' '[:lower:]'
            )"
            if [ "$actual_cert_sha256" != "$expected_cert_sha256" ]; then
              echo "Signing certificate mismatch: $apk"
              exit 1
            fi
            badging="$("$aapt" dump badging "$apk")"
            actual_version_code="$(printf '%s\n' "$badging" | sed -n "s/^package:.*versionCode='\([^']*\)'.*/\1/p")"
            if [ "$actual_version_code" != "$EXPECTED_VERSION_CODE" ]; then
              echo "versionCode mismatch in $apk: expected $EXPECTED_VERSION_CODE, got $actual_version_code"
              exit 1
            fi
            actual_version_name="$(printf '%s\n' "$badging" | sed -n "s/^package:.*versionName='\([^']*\)'.*/\1/p")"
            if [ "$actual_version_name" != "$EXPECTED_VERSION_NAME" ]; then
              echo "versionName mismatch in $apk: expected $EXPECTED_VERSION_NAME, got $actual_version_name"
              exit 1
            fi
          done
          printf -- '- signing certificate SHA-256: %s\n- verified APKs: %s\n' \
            "$expected_cert_sha256" "${#apks[@]}" >> "$GITHUB_STEP_SUMMARY"

      - name: Prepare release assets and changelog
        id: release_meta
        shell: bash
        env:
          INPUT_RELEASE_NAME: ${{ inputs.release_name }}
          INPUT_CHANGELOG: ${{ inputs.changelog }}
          RELEASE_VERSION_NAME: ${{ steps.android_version.outputs.version_name }}
        run: |
          set -euo pipefail
          mkdir -p build/release-assets build/go-client build/server
          mapfile -t apks < <(find app/build/outputs/apk -type f -name '*.apk' | sort)
          if [ "${#apks[@]}" -eq 0 ]; then
            echo "No release APKs were generated"
            exit 1
          fi
          for apk in "${apks[@]}"; do
            case "$(basename "$apk")" in
              *arm64-v8a*) output="WDTT-arm64-v8a.apk" ;;
              *armeabi-v7a*) output="WDTT-armeabi-v7a.apk" ;;
              *x86_64*) output="WDTT-x86_64.apk" ;;
              *universal*) output="WDTT-universal.apk" ;;
              *) output="$(basename "$apk")" ;;
            esac
            cp "$apk" "build/release-assets/$output"
          done
          cp app/src/main/assets/server build/server/wdtt-server-linux-amd64
          cp app/src/main/jniLibs/arm64-v8a/libclient.so build/go-client/libclient-arm64-v8a.so
          cp app/src/main/jniLibs/armeabi-v7a/libclient.so build/go-client/libclient-armeabi-v7a.so
          cp app/src/main/jniLibs/x86_64/libclient.so build/go-client/libclient-x86_64.so

          tag="v${RELEASE_VERSION_NAME}"
          release_name="${INPUT_RELEASE_NAME:-WDTT ${RELEASE_VERSION_NAME} (${tag})}"
          previous_tag="$(git describe --tags --abbrev=0 2>/dev/null || true)"
          if [ -n "$INPUT_CHANGELOG" ]; then
            changelog="$INPUT_CHANGELOG"
          elif [ -n "$previous_tag" ]; then
            changelog="$(git log --pretty=format:'- %s (%h)' "${previous_tag}..HEAD")"
          else
            changelog="$(git log -n 30 --pretty=format:'- %s (%h)')"
          fi
          [ -n "$changelog" ] || changelog="- Release build from ${GITHUB_SHA::7}"
          printf '%s\n' "$changelog" > build/release-notes.md
          echo "tag_name=$tag" >> "$GITHUB_OUTPUT"
          echo "release_name=$release_name" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.release_meta.outputs.tag_name }}
          name: ${{ steps.release_meta.outputs.release_name }}
          body_path: build/release-notes.md
          target_commitish: ${{ github.sha }}
          draft: ${{ inputs.draft }}
          prerelease: ${{ inputs.prerelease }}
          files: build/release-assets/*
          fail_on_unmatched_files: true
          overwrite_files: true

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: WDTT-release-build
          path: |
            build/release-assets/*
            build/server/*
            build/go-client/*
          if-no-files-found: error
          retention-days: 14

      - name: Remove release keystore
        if: always()
        shell: bash
        env:
          KEYSTORE_PATH: ${{ steps.release_keystore.outputs.keystore_path }}
        run: |
          if [ -n "${KEYSTORE_PATH:-}" ] && [ -f "$KEYSTORE_PATH" ]; then
            shred -u "$KEYSTORE_PATH" || rm -f "$KEYSTORE_PATH"
          fi
