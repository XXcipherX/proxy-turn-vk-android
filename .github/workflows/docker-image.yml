name: Build and push docker image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Docker image tag
        required: true
        default: latest
      platforms:
        description: Target platforms
        required: true
        default: linux/amd64,linux/arm64
      also_latest:
        description: Also push the latest tag when tag is not latest
        type: boolean
        required: true
        default: true

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/xxcipherx/wdtt-server

jobs:
  build-and-push:
    name: Build and push docker image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare image tags
        id: tags
        shell: bash
        env:
          IMAGE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          tag="$IMAGE_TAG"
          if ! [[ "$tag" =~ ^[A-Za-z0-9_.-]+$ ]]; then
            echo "Invalid tag: $tag"
            echo "Use only letters, digits, dot, underscore and dash."
            exit 1
          fi

          {
            echo "value<<EOF"
            echo "${IMAGE_NAME}:${tag}"
            if [ "${{ inputs.also_latest }}" = "true" ] && [ "$tag" != "latest" ]; then
              echo "${IMAGE_NAME}:latest"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ inputs.platforms }}
          pull: true
          push: true
          tags: ${{ steps.tags.outputs.value }}
